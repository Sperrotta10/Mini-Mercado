name: Keep Aiven DB Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Aiven MySQL
        run: |
          mysql -h "${{ secrets.AIVEN_MYSQL_HOST }}" \
                -P "${{ secrets.AIVEN_MYSQL_PORT }}" \
                -u "${{ secrets.AIVEN_MYSQL_USER }}" \
                -p"${{ secrets.AIVEN_MYSQL_PASSWORD }}" \
                -e "SELECT 1;"